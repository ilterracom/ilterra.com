# Site-wide settings. Links that start with "/" are site-root paths: the build
# turns them into relative links, so never write the domain name here.

name: ilTerra
title: ilTerra – Nothing is impossible for us   # <title> of the home page
title_suffix: " – ilTerra"                     # appended to other page titles
tagline: Nothing is impossible for us
description: >-
  ILTERRA is the business of Yauhen Panimatchanka, Solution Architect & Engineer:
  cloud, data and architecture for companies worldwide.
lang: en
logo: /assets/img/ilterra-logo.png
og_image: /assets/img/avatar.jpg

# Absolute links to these hosts inside the site are reported as errors by the build.
