# Tag cloud on the home page: font sizes in pt (same scale as the old WordPress widget).
tag_cloud:
  smallest: 8
  largest: 22
  limit: 0          # 0 = show every tag

# Google Analytics + consent. Leave tag_id empty to switch analytics off.
google:
  tag_id: GT-55XZZVT        # Google tag of the GA4 property (same as on the old WordPress site)
  consent_mode: true        # EEA/UK/CH visitors: no analytics/ads cookies until they accept
  consent_banner: true      # Google's own GDPR banner (AdSense -> Privacy & messaging)

# AdSense: manual ad units only. Keep "Auto ads" OFF for this site in AdSense,
# otherwise Google adds its own blocks everywhere (including the home page).
adsense:
  client: ca-pub-9800010230612028
  page_types: [article, product, doc]   # page types that show ads; front matter "ads: false" turns them off per page
  # Ad units from AdSense -> Ads -> By ad unit. id = data-ad-slot; empty id = block not shown.
  # format must match the unit type in AdSense: display | in-article | multiplex
  slots:
    sidebar:                # right column under "On this page", desktop only
      id: "7545858347"      # AdSense unit "Боковой виджет" (Display)
      format: display
    article_end:            # after the article text, all screen sizes
      id: "9856610966"      # AdSense unit "ilterra_near-TOC" (In-article)
      format: in-article
    # Not used on purpose: Multiplex "after-post-content" (2006041108) - a grid of ads
    # right above "More articles" looks heavy. To try it, add a slot here and in page.html.

home:
  articles:
    enabled: true   # "Behind the Work" block: latest posts from the category below
    title: Behind the Work
    category: knowledge-sharing
    limit: 3
